<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Tab icon: the torch, reduced to what survives at 16px. The flame is
       almost the whole mark; the handle is a hint, not a drawing. -->
  <defs>
    <linearGradient id="f" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0"    stop-color="#ff5a1f"/>
      <stop offset="0.55" stop-color="#ff9d2e"/>
      <stop offset="1"    stop-color="#ffe9a8"/>
    </linearGradient>
  </defs>

  <!-- flame -->
  <path fill="url(#f)"
        d="M16 1.5C9.4 9.2 8 14.4 10.4 18.6c1.2 2.1 3.3 3.4 5.6 3.4s4.4-1.3 5.6-3.4C24 14.4 22.6 9.2 16 1.5Z"/>
  <!-- bright core, so it still reads as fire when scaled down -->
  <path fill="#fff3cf" opacity="0.92"
        d="M16 9.6c-2.3 3.4-2.8 6-1.9 8.2.5 1.3 1.2 2 1.9 2s1.4-.7 1.9-2c.9-2.2.4-4.8-1.9-8.2Z"/>

  <!-- brazier -->
  <path fill="#9a9a96" d="M9.6 21.4h12.8l-2.6 4.2H12.2Z"/>
  <rect fill="#9a9a96" x="8.4" y="20.2" width="15.2" height="1.9" rx="0.9"/>
  <!-- haft -->
  <rect fill="#9a9a96" x="14.7" y="25.4" width="2.6" height="5.4" rx="0.6"/>
</svg>
