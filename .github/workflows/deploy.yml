name: Deploy to GitHub Pages

# The site is a single static index.html plus assets — there is no Node
# project here, so there is nothing to install and nothing to build. The
# previous version of this file ran `npm ci && npm run build` and published
# ./out, which fails on the first step: no package.json, no lockfile, no out/.

on:
  push:
    branches: [main, monochrome]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          # Pages runs Jekyll unless told otherwise, which silently drops
          # files and folders beginning with an underscore.
          touch _site/.nojekyll
          echo "--- publishing ---"
          find _site -type f -printf '%10s  %p\n' | sort -k2

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
